services:
  - type: web
    name: dynamic-document-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MODEL_BACKEND
        value: hosted_api
      - key: QWEN_API_BASE
        value: https://openrouter.ai/api/v1
      - key: QWEN_MODEL_NAME
        value: qwen/qwen2.5-vl-72b-instruct
      - key: QWEN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: REQUEST_TIMEOUT
        value: "180"
      - key: MAX_NEW_TOKENS
        value: "4096"
