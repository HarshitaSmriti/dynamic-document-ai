services:
  - type: web
    name: dynamic-document-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MODEL_BACKEND
        value: local
      - key: QWEN_MODEL_ID
        value: Qwen/Qwen2.5-VL-7B-Instruct
      - key: QWEN_DEVICE
        value: auto
      - key: QWEN_MAX_NEW_TOKENS
        value: "1024"
      - key: QWEN_TEMPERATURE
        value: "0.0"
      - key: CORS_ORIGINS
        value: "*"
      - key: REQUEST_TIMEOUT
        value: "180"
